name: Run checks
on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Next.js Build
        run: npm run build-prod:data-portal
      - name: Run Prettier
        run: npm run check-format
      - name: Run Linter (ESLint)
        run: npm run lint
      - name: Type Check
        run: npx tsc --noEmit
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # diff-cover compares against the base branch, so it needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Off: a shared CI cache can let one run tamper with a later one, and
          # it saves about a second here.
          enable-cache: false
          version: "0.13.7"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Coverage totals
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.txt') != '' }}
        # Fenced: text-summary's "=====" lines would otherwise render as a heading.
        run: |
          cat coverage/coverage-summary.txt
          {
            echo "### Unit test coverage"
            echo '```'
            cat coverage/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Changed-line coverage
        run: npm run test:diff-coverage -- --format "markdown:$GITHUB_STEP_SUMMARY"
        env:
          BASE: ${{ github.base_ref }}
